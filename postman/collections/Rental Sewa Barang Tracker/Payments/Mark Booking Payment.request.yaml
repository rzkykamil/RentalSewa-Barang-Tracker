$kind: http-request
name: Mark Booking Payment
method: PATCH
url: "{{baseUrl}}api/v1/bookings/{{bookingId}}/payment"
description: >-
  Owner (pemilik barang pada booking tsb) only — tandai status pembayaran
  (`BELUM_LUNAS`/`LUNAS`) + catatan metode opsional (mis. "transfer BCA").
  `markedPaidAt` otomatis di-set saat status jadi `LUNAS`, dikosongkan lagi
  kalau direvert ke `BELUM_LUNAS`. Balas 401 UNAUTHENTICATED kalau belum
  login, 404 NOT_FOUND kalau booking tidak ada, 403 FORBIDDEN kalau bukan
  pemilik barang, 422 BUSINESS_RULE_VIOLATION kalau booking belum pernah
  di-`approve` (record `Payment` belum ada).
order: 2000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "LUNAS",
      "methodNote": "Transfer BCA"
    }
